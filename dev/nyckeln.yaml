# Config for the local SSO mock (nyckeln-under-dorrmattan).
# On the login page, enter the kth_id of one of the users below.

clients:
  - id: dare
    secret: dev-secret
    # Also let in KTH users who aren't chapter members (from `ldap` below).
    allows_guests: true
    redirect_uris:
      - http://localhost:3000/auth/callback
      - http://localhost:3001/auth/callback

users:
  # Admin: member of dÅrestaben, which has the `admin` permission below.
  - ug_kth_id: u1turetek
    kth_id: turetek
    email: turetek@kth.se
    first_name: Ture
    family_name: Teknolog
    year_tag: D-23
    membership: ordinary
    # Stand-in profile pictures (real SSO gets them from rfinger).
    picture: https://api.dicebear.com/9.x/notionists/png?seed=turetek&size=256&backgroundColor=c0aede
    thumbnail: https://api.dicebear.com/9.x/notionists/png?seed=turetek&size=96&backgroundColor=c0aede
  # Regular chapter member.
  - ug_kth_id: u1nollan
    kth_id: nollan
    email: nollan@kth.se
    first_name: Nollan
    family_name: Nollansson
    year_tag: D-26
    membership: ordinary
    picture: https://api.dicebear.com/9.x/notionists/png?seed=nollan&size=256&backgroundColor=b6e3f4
    thumbnail: https://api.dicebear.com/9.x/notionists/png?seed=nollan&size=96&backgroundColor=b6e3f4

# Mirrors Hive: dÅrestaben is granted the `admin` permission in the `dare`
# system, which SSO returns through the `permissions` scope.
hive:
  groups:
    - name: dÅrestaben
      description: dÅre Staff
      id: darestaben
      domain: datasektionen.se
      members:
        - turetek
      permissions:
        - id: admin
          scope: null

# KTH users outside the chapter, allowed in as guests.
ldap:
  - ug_kth_id: u1gaest
    kth_id: gaest
    first_name: Gäst
    family_name: Gästsson
